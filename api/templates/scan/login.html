<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Cooler Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/api/scan.css">
</head>
<body class="bg-light">

<div class="container" style="max-width: 420px; margin-top: 15vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="mb-3 text-center">Cooler Verification</h3>
            <p class="text-muted text-center small">Sign in to scan coolers</p>

            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="login-btn">
                    Sign in
                </button>
            </form>

            <div id="error" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>
</div>

<script>
const form = document.getElementById('login-form');
const btn = document.getElementById('login-btn');
const errBox = document.getElementById('error');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.add('d-none');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || 'Invalid credentials');
        }

        const data = await res.json();
        localStorage.setItem('access_token', data.access);
        localStorage.setItem('refresh_token', data.refresh);
        localStorage.setItem('username', username);

        window.location.href = '/scan/';
    } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Sign in';
    }
});
</script>

</body>
</html>
