<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scan — Cooler Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/api/scan.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0">Cooler Verification</span>
        <span class="text-white small">
            <span id="current-user"></span>
            <button class="btn btn-sm btn-outline-light ms-2" id="logout-btn">Logout</button>
        </span>
    </div>
</nav>

<div class="container py-3" style="max-width: 520px;">

    <!-- Progress -->
    <div class="d-flex justify-content-between mb-3 small text-muted">
        <span id="step-label">Step 1 of 3</span>
        <span id="site-label"></span>
    </div>

    <!-- Scan card -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h5 class="card-title" id="scan-title">Scan Cooler Tag</h5>
            <p class="text-muted small" id="scan-hint">Point the camera at the barcode.</p>

            <div id="video-wrap" class="position-relative bg-black rounded mb-3" style="aspect-ratio: 4/3; overflow: hidden;">
                <video id="video" autoplay playsinline muted style="width:100%; height:100%; object-fit: cover;"></video>
                <div id="scan-line"></div>
            </div>

            <div class="mb-2 small text-muted">Captured:</div>
            <input type="text" class="form-control form-control-lg mb-3" id="value-input" placeholder="—">

            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary flex-fill" id="type-toggle-btn">
                    Type instead
                </button>
                <button class="btn btn-primary flex-fill" id="next-btn">
                    Next
                </button>
            </div>

            <div id="scan-error" class="alert alert-warning mt-3 d-none small"></div>
        </div>
    </div>

    <!-- Summary card -->
    <div class="card shadow-sm mb-3 d-none" id="summary-card">
        <div class="card-body">
            <h6 class="mb-3">Scan Summary</h6>
            <div class="row mb-2">
                <div class="col-4 text-muted">Tag:</div>
                <div class="col-8" id="summary-tag">—</div>
            </div>
            <div class="row mb-2">
                <div class="col-4 text-muted">Serial:</div>
                <div class="col-8" id="summary-serial">—</div>
            </div>
            <div class="row mb-3">
                <div class="col-4 text-muted">Asset:</div>
                <div class="col-8" id="summary-asset">—</div>
            </div>
            <button class="btn btn-success w-100 btn-lg" id="verify-btn">Verify</button>
            <button class="btn btn-outline-secondary w-100 mt-2" id="reset-btn">Start over</button>
        </div>
    </div>

    <!-- Result banner -->
    <div id="result-banner" class="alert d-none" role="alert"></div>

</div>

<script src="/static/api/scan.js"></script>

</body>
</html>
